<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מי בא ליציאה?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9f1f4; --surface:#ffffff; --text:#10222d; --muted:#587080; --line:#c3d5dd;
  --accent:#0b7a75; --accent-ink:#ffffff; --sel-bg:#d7f0ee;
  --err:#c62828; --err-bg:#fdeaea;
  --warn:#8a5a00; --warn-bg:#fff2cf;
  --ok:#17783a; --ok-bg:#e0f4e7;
  --note:#4a3fa0; --note-bg:#eae8fb;
  --overlay:rgba(8,20,28,.55);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1a22; --surface:#13262f; --text:#e6f1f4; --muted:#8fa8b4; --line:#254150;
    --accent:#3fd0c4; --accent-ink:#04201e; --sel-bg:#12404a;
    --err:#ff7b7b; --err-bg:#3a1a1d;
    --warn:#f2c46b; --warn-bg:#3b2f14;
    --ok:#7fdc9c; --ok-bg:#16351f;
    --note:#b9b0ff; --note-bg:#25214a;
    --overlay:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1a22; --surface:#13262f; --text:#e6f1f4; --muted:#8fa8b4; --line:#254150;
  --accent:#3fd0c4; --accent-ink:#04201e; --sel-bg:#12404a;
  --err:#ff7b7b; --err-bg:#3a1a1d;
  --warn:#f2c46b; --warn-bg:#3b2f14;
  --ok:#7fdc9c; --ok-bg:#16351f;
  --note:#b9b0ff; --note-bg:#25214a;
  --overlay:rgba(0,0,0,.65);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100%;
  background:var(--bg); color:var(--text);
  font-family:"Rubik","Heebo","Segoe UI",system-ui,Arial,sans-serif;
  font-size:17px; line-height:1.5;
}
main{max-width:560px; margin:0 auto; padding:28px 18px 48px}
h1{
  font-family:"Secular One","Rubik",system-ui,Arial,sans-serif;
  font-weight:400; font-size:clamp(2.1rem,9vw,3rem); line-height:1.1; margin:0 0 6px;
}
.lead{margin:0 0 26px; color:var(--muted)}
h2{font-family:"Secular One","Rubik",system-ui,Arial,sans-serif; font-weight:400; font-size:1.35rem; margin:0 0 12px}
.panel{background:var(--surface); border:1.5px solid var(--line); border-radius:18px; padding:18px; margin-bottom:22px}
label.field{display:block; font-weight:500; margin-bottom:8px}
input[type=date]{
  width:100%; font:inherit; font-size:1.1rem; color:var(--text); background:var(--bg);
  border:1.5px solid var(--line); border-radius:12px; padding:13px 14px; min-height:52px;
}
input[type=date]:focus-visible,.slot input:focus-visible+span,.person:focus-visible,.btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.slots{display:grid; gap:10px; margin-top:6px}
.slot{display:block; position:relative}
.slot input{position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer}
.slot span{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  border:1.5px solid var(--line); background:var(--bg); border-radius:12px; padding:13px 14px; min-height:52px;
}
.slot b{font-weight:600; direction:ltr; unicode-bidi:isolate}
.slot small{color:var(--muted); font-size:.9rem}
.slot input:checked+span{border-color:var(--accent); background:var(--sel-bg); box-shadow:inset 0 0 0 1px var(--accent)}
.when{margin:0 0 14px; font-weight:500; color:var(--muted)}
.names{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
.person{
  position:relative; font:inherit; color:var(--text); cursor:pointer;
  background:var(--surface); border:1.5px solid var(--line); border-radius:16px;
  min-height:84px; padding:14px; display:flex; align-items:center; justify-content:center;
  font-family:"Secular One","Rubik",system-ui,Arial,sans-serif; font-size:1.55rem; -webkit-tap-highlight-color:transparent;
}
.person .tick{
  position:absolute; top:8px; inset-inline-start:8px; width:24px; height:24px; border-radius:50%;
  background:var(--accent); color:var(--accent-ink); font:700 14px/24px "Rubik",system-ui,sans-serif; text-align:center; display:none;
}
.person.on{border-color:var(--accent); background:var(--sel-bg); box-shadow:inset 0 0 0 1px var(--accent)}
.person.on .tick{display:block}
.picked{margin:16px 0 0; min-height:1.5em; color:var(--muted)}
.picked strong{color:var(--text); font-weight:600}
#step2[hidden]{display:none}
#step2{animation:reveal .35s ease-out}
@keyframes reveal{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

.overlay{
  position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  background:var(--overlay);
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
}
.overlay[hidden]{display:none}
.modal{
  width:100%; max-width:420px; background:var(--surface); border-radius:20px; overflow:hidden;
  border:1.5px solid var(--line); animation:pop .18s ease-out;
}
@keyframes pop{from{opacity:0; transform:scale(.94)}to{opacity:1; transform:none}}
.m-head{display:flex; align-items:center; gap:10px; padding:14px 18px; font-weight:600}
.m-body{padding:18px 18px 8px}
.m-main{font-size:1.12rem; margin:0}
.m-sub{margin:10px 0 0; color:var(--muted)}
.m-foot{padding:14px 18px 18px}
.btn{
  width:100%; min-height:50px; border:0; border-radius:12px; cursor:pointer;
  background:var(--accent); color:var(--accent-ink); font:600 1.05rem "Rubik",system-ui,sans-serif;
}
.modal[data-kind="warn"] .m-head{background:var(--warn-bg); color:var(--warn)}
.modal[data-kind="err"] .m-head{background:var(--err-bg); color:var(--err)}
.modal[data-kind="err"] .m-main{color:var(--err); font-weight:700; font-size:1.5rem}
.modal[data-kind="ok"] .m-head{background:var(--ok-bg); color:var(--ok)}
.modal[data-kind="note"] .m-head{background:var(--note-bg); color:var(--note)}
@media (prefers-reduced-motion:reduce){#step2,.modal{animation:none}}
@media (min-width:480px){.names{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main>
  <h1>מי בא ליציאה?</h1>
  <p class="lead">בוחרים מתי יוצאים, ואז מסמנים מי בא.</p>

  <section class="panel" aria-labelledby="h-when">
    <h2 id="h-when">מתי יוצאים?</h2>
    <label class="field" for="date">תאריך היציאה</label>
    <input type="date" id="date">
    <div class="field" style="margin-top:18px" id="slot-label">שעת היציאה</div>
    <div class="slots" role="radiogroup" aria-labelledby="slot-label">
      <label class="slot"><input type="radio" name="slot" value="09:00–10:00"><span><b>09:00–10:00</b><small>בוקר</small></span></label>
      <label class="slot"><input type="radio" name="slot" value="20:00–22:00"><span><b>20:00–22:00</b><small>ערב</small></span></label>
      <label class="slot"><input type="radio" name="slot" value="20:00–00:00"><span><b>20:00–00:00</b><small>ערב עד חצות</small></span></label>
    </div>
  </section>

  <section class="panel" id="step2" hidden aria-labelledby="h-who">
    <h2 id="h-who">מי בא?</h2>
    <p class="when" id="when"></p>
    <div class="names" id="names"></div>
    <p class="picked" id="picked" aria-live="polite"></p>
  </section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" data-kind="warn">
    <div class="m-head"><span id="mIcon" aria-hidden="true"></span><span id="mTitle"></span></div>
    <div class="m-body">
      <p class="m-main" id="mMain"></p>
      <p class="m-sub" id="mSub"></p>
    </div>
    <div class="m-foot"><button type="button" class="btn" id="mOk"></button></div>
  </div>
</div>

<script>
var PEOPLE = [
  {id:'yigal', name:'יגאל', kind:'warn', allow:true,  main:'יגאל לא בא בלי אדר, ובתנאי שאין היום רובנס.', needs:'adar'},
  {id:'adar',  name:'אדר',  kind:'warn', allow:true,  main:'אדר לא בא אם יש היום תואר מהטוהר או אם שכח שקבע להיום.'},
  {id:'maor',  name:'מאור', kind:'warn', allow:true,  main:'מאור לא בא בלי יגאל.', needs:'yigal'},
  {id:'ofek',  name:'אופק', kind:'err',  allow:false, main:'אופק לא בא!!!', sub:'(אלא אם זו יציאה ביום רביעי בבוקר בין 09:00 ל-09:30 בלבד)'},
  {id:'tzach', name:'צח',   kind:'ok',   allow:true,  main:'צח בא תמיד.'},
  {id:'yarin', name:'ירין', kind:'warn', allow:true,  main:'ירין לא בא בלי יגאל.', needs:'yigal'},
  {id:'tomer', name:'תומר', kind:'note', allow:true,  main:'בא בתנאי שהיציאה מתחילה ב21:00 ומסתיימת לכל המאוחר ב-22:00 כי מחר צבא, ובתנאי שלא קבע עם החברים המוזרים שלו מהצבא בלאגר או שלא קבע ריצה עם רוני בשיא החום.'}
];
var TITLES = {warn:'שים לב', err:'לא ניתן לבחור', ok:'מעולה', note:'הערה'};
var ICONS  = {warn:'⚠️', err:'⛔', ok:'✅', note:'📝'};

var selected = [];
var afterClose = null;
function $(s){ return document.querySelector(s); }

function readySlot(){
  var r = document.querySelector('input[name="slot"]:checked');
  return r ? r.value : '';
}

function isWedMorning(){
  var d = $('#date').value;
  if(!d || readySlot().indexOf('09:00') !== 0){ return false; }
  var p = d.split('-');
  return new Date(+p[0], +p[1]-1, +p[2]).getDay() === 3;
}

function updateWhen(){
  var d = $('#date').value, s = readySlot();
  if(!d || !s){ $('#step2').hidden = true; return; }
  var p = d.split('-');
  var dt = new Date(+p[0], +p[1]-1, +p[2]);
  var txt = dt.toLocaleDateString('he-IL', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  $('#when').textContent = txt + ', ' + s;
  var wasHidden = $('#step2').hidden;
  $('#step2').hidden = false;
  var dropped = selected.indexOf('ofek') !== -1 && !isWedMorning();
  if(dropped){ removeWithDependents('ofek'); }
  if(wasHidden || dropped){ renderNames(); }
}

function renderNames(focusId){
  var box = $('#names');
  box.innerHTML = '';
  PEOPLE.forEach(function(p){
    var on = selected.indexOf(p.id) !== -1;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'person' + (on ? ' on' : '');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.dataset.id = p.id;
    var tick = document.createElement('span');
    tick.className = 'tick'; tick.setAttribute('aria-hidden','true'); tick.textContent = '✓';
    var nm = document.createElement('span');
    nm.textContent = p.name;
    b.appendChild(tick); b.appendChild(nm);
    b.addEventListener('click', function(){ toggle(p); });
    box.appendChild(b);
    if(focusId === p.id){ b.focus(); }
  });
  var names = PEOPLE.filter(function(p){ return selected.indexOf(p.id) !== -1; }).map(function(p){ return p.name; });
  var out = $('#picked');
  out.textContent = '';
  if(names.length){
    var s = document.createElement('strong');
    s.textContent = names.join(', ');
    out.appendChild(document.createTextNode('נבחרו (' + names.length + '): '));
    out.appendChild(s);
  } else {
    out.textContent = 'עוד לא נבחר אף אחד.';
  }
}

function byId(id){ return PEOPLE.filter(function(x){ return x.id === id; })[0]; }

function removeWithDependents(id){
  var i = selected.indexOf(id);
  if(i !== -1){ selected.splice(i,1); }
  PEOPLE.forEach(function(x){
    if(x.needs === id && selected.indexOf(x.id) !== -1){ removeWithDependents(x.id); }
  });
}

function toggle(p){
  var i = selected.indexOf(p.id);
  if(i !== -1){ removeWithDependents(p.id); renderNames(p.id); return; }
  if(p.needs && selected.indexOf(p.needs) === -1){
    var n = byId(p.needs);
    showModal({
      name:p.name, kind:'err', allow:false,
      main:p.name + ' לא בא בלי ' + n.name + '.',
      sub:'כדי לבחור את ' + p.name + ' צריך לבחור קודם את ' + n.name + '.'
    }, function(){ renderNames(p.id); });
    return;
  }
  var allow = p.allow;
  var shown = p;
  if(p.id === 'ofek'){
    allow = isWedMorning();
    shown = Object.assign({}, p, {allow:allow, title: allow ? 'שים לב' : undefined});
  }
  showModal(shown, function(){
    if(allow && selected.indexOf(p.id) === -1){ selected.push(p.id); }
    renderNames(p.id);
  });
}

function showModal(p, cb){
  $('#modal').dataset.kind = p.kind;
  $('#mIcon').textContent = ICONS[p.kind];
  $('#mTitle').textContent = p.name + ' — ' + (p.title || TITLES[p.kind]);
  $('#mMain').textContent = p.main;
  var sub = $('#mSub');
  sub.textContent = p.sub || '';
  sub.hidden = !p.sub;
  $('#mOk').textContent = p.allow ? 'הבנתי' : 'סגור';
  afterClose = cb;
  $('#overlay').hidden = false;
  $('#mOk').focus();
}

function closeModal(){
  if($('#overlay').hidden){ return; }
  $('#overlay').hidden = true;
  var f = afterClose; afterClose = null;
  if(f){ f(); }
}

$('#mOk').addEventListener('click', closeModal);
$('#overlay').addEventListener('click', function(e){ if(e.target === this){ closeModal(); } });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ closeModal(); } });
$('#date').addEventListener('change', updateWhen);
$('#date').addEventListener('click', function(){ try{ this.showPicker(); }catch(e){} });
document.querySelectorAll('input[name="slot"]').forEach(function(r){ r.addEventListener('change', updateWhen); });
</script>
</body>
</html>
